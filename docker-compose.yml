version: "3.8"  # Docker Compose file format version (3.8 is widely supported)

services:

# Service 1 -------------------------

  postgres:
    image: postgres:16          # Official Postgres image, version 16 (latest stable)
    container_name: clickpe_postgres
    restart: unless-stopped     # Auto-restart if it crashes, but not if you stop it manually

    environment:
      # These env vars are read by the Postgres image on first startup
      # to create the initial database and user credentials.
      POSTGRES_USER: clickpe_user         
      POSTGRES_PASSWORD: clickpe_pass     
      POSTGRES_DB: clickpe_db             

    ports:
      # HOST_PORT:CONTAINER_PORT
      # Maps port 5432 inside the container to 5432 on your machine.
      # This lets tools like pgAdmin or DBeaver connect from your laptop.
      - "5432:5432"

    volumes:
      # NAMED VOLUME: Persists database files across container restarts.
      # Without this, your data would be lost every time you run `docker compose down`.
      - postgres_data:/var/lib/postgresql/data

      # BIND MOUNT: Copies our schema.sql into the container's init directory.
      # Postgres automatically runs any .sql files in /docker-entrypoint-initdb.d/
      # on FIRST startup (when the database is brand new).
      # This creates our users, loan_products, and matches tables automatically.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

    healthcheck:
      # Docker will periodically run this command to check if Postgres is ready.
      # Other services (like n8n) can wait for this before starting.
      test: ["CMD-SHELL", "pg_isready -U clickpe_user -d clickpe_db"]
      interval: 5s      # Check every 5 seconds
      timeout: 5s        # Give up if check takes more than 5 seconds
      retries: 5          # Mark unhealthy after 5 consecutive failures

# Service 2 -------------------------
  n8n:
    image: n8nio/n8n:latest     # Official n8n Docker image
    container_name: clickpe_n8n
    restart: unless-stopped

    environment:
      # --- n8n's own database ---
      # n8n needs a database to store its workflows, credentials, and execution
      # history. By default it uses SQLite, but we point it to our Postgres
      # for reliability. This is n8n's INTERNAL storage, separate from our
      # app tables (users, loan_products, matches).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres          # Hostname = the service name above
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: clickpe_db    # Same database, different tables
      DB_POSTGRESDB_USER: clickpe_user
      DB_POSTGRESDB_PASSWORD: clickpe_pass

      # --- n8n configuration ---
      # WEBHOOK_URL: The base URL n8n uses when generating webhook URLs.
      # When Lambda finishes processing a CSV, it calls this URL to trigger
      # Workflow B. "host.docker.internal" is a special Docker hostname that
      # points to your host machine (your laptop).
      WEBHOOK_URL: http://localhost:5678

      # N8N_SECURE_COOKIE: Set to false for local HTTP development.
      # In production with HTTPS, you'd set this to true.
      N8N_SECURE_COOKIE: "false"

      # GENERIC_TIMEZONE: So scheduled triggers (Workflow A runs daily) use
      # your timezone, not UTC.
      GENERIC_TIMEZONE: Asia/Kolkata

      # N8N_DIAGNOSTICS_ENABLED: Disable telemetry/analytics for privacy.
      N8N_DIAGNOSTICS_ENABLED: "false"

      # Allow Code nodes in workflows to access environment variables
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

    ports:
      # n8n's web UI runs on port 5678.
      # You'll open http://localhost:5678 in your browser to build workflows.
      - "5678:5678"

    volumes:
      # Persists n8n data (workflows, credentials, execution logs).
      # Without this, you'd lose all your workflows when the container restarts.
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy   # Wait for Postgres to be ready before starting n8n
        # WHY: If n8n starts before Postgres is ready, it can't connect to the
        # database and will crash on startup.

# =============================================================================
# VOLUMES
# =============================================================================
# Named volumes are Docker-managed storage locations on your disk.
# They survive `docker compose down` and `docker compose up` cycles.
# To truly delete all data: `docker compose down -v` (the -v flag removes volumes)
# =============================================================================
volumes:
  postgres_data:    # Stores PostgreSQL database files
  n8n_data:         # Stores n8n workflows, credentials, execution history
