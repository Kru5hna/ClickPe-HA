service: clickpe-loan-engine # Name of your service (used in resource naming)

# The Serverless Framework version and provider settings
frameworkVersion: "3" # Version 3 of Serverless Framework
plugins:
  - serverless-offline
provider:
  name: aws # We're deploying to AWS (not Azure, GCP, etc.)
  runtime: python3.11 # Lambda runtime — Python 3.11 is latest stable
  region: ap-south-1 # Mumbai region (closest to India for low latency)
  stage: dev # Deployment stage (dev/staging/prod)

  # ENVIRONMENT VARIABLES available to ALL Lambda functions in this service.
  # These are injected at deploy time, so you don't hardcode values in code.
  environment:
    # UPLOAD_BUCKET: The S3 bucket name for CSV uploads.
    UPLOAD_BUCKET: clickpe-csv-uploads-${self:provider.stage}

    # Database connection settings.
    # In production, these would point to your RDS instance.
    # For local testing, override these with your Docker Postgres values.
    DB_HOST: ${env:DB_HOST, 'localhost'}
    DB_PORT: "5432"
    DB_NAME: clickpe_db
    DB_USER: clickpe_user
    DB_PASSWORD: ${env:DB_PASSWORD, 'clickpe_pass'}

    # n8n webhook URL — Lambda calls this after processing a CSV.
    # For local dev, you'd use an ngrok/tunnel URL so AWS can reach your laptop.
    N8N_WEBHOOK_URL: ${env:N8N_WEBHOOK_URL, 'http://localhost:5678/webhook/matching-trigger'}

  # IAM ROLE STATEMENTS: Permissions granted to ALL Lambda functions.
  # Lambda functions run with minimal permissions by default. We need to
  # explicitly allow them to access S3.
  iam:
    role:
      statements:
        # Allow Lambda to read/write objects in our S3 bucket.
        # s3:GetObject = download files (csv_processor needs this)
        # s3:PutObject = generate presigned URLs for upload
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource:
            # !GetAtt gets an attribute of a CloudFormation resource.
            # UploadBucket.Arn returns something like "arn:aws:s3:::clickpe-csv-uploads"
            # The /* means "all objects inside the bucket"
            - !Join ["", [!GetAtt UploadBucket.Arn, "/*"]]

# =============================================================================
# LAMBDA FUNCTIONS
# =============================================================================
functions:
  # ---------------------------------------------------------------------------
  # FUNCTION 1: Presigned URL Generator
  # ---------------------------------------------------------------------------
  # Called by the frontend to get a temporary S3 upload URL.
  # Exposed through API Gateway as a GET endpoint.
  # ---------------------------------------------------------------------------
  getPresignedUrl:
    handler: lambda/presigned_url/handler.handler
    # handler format: <file_path>.<function_name>
    # So this means: "run the handler() function in lambda/presigned_url/handler.py"

    timeout: 10 # Max 10 seconds to execute (generating a URL is instant)
    memorySize: 128 # 128MB RAM is more than enough for this simple function

    events:
      # API Gateway event: Creates an HTTP endpoint automatically.
      # After deploy, you get a URL like:
      # https://abc123.execute-api.ap-south-1.amazonaws.com/dev/upload-url
      - http:
          path: upload-url # The URL path
          method: get # HTTP GET request
          cors: true # Enable CORS so browsers can call this API
          # CORS (Cross-Origin Resource Sharing): Without this, a browser
          # running your HTML page on localhost would be blocked from calling
          # this API on a different domain (AWS).

  # ---------------------------------------------------------------------------
  # FUNCTION 2: CSV Processor
  # ---------------------------------------------------------------------------
  # Triggered automatically when a file is uploaded to S3.
  # Downloads the CSV, parses it, inserts users into Postgres.
  # ---------------------------------------------------------------------------
  processCsv:
    handler: lambda/csv_processor/handler.handler
    timeout: 300 # 5 minutes — processing 10K rows might take a while
    memorySize: 512 # 512MB RAM — CSV parsing needs more memory than URL generation

    # Package individually: Only include this function's files in its deployment
    # package, not the entire project. Keeps the Lambda small and fast to deploy.
    package:
      individually: true
      patterns:
        - "lambda/csv_processor/**" # Include only the csv_processor directory

    events:
      # S3 EVENT: This is the "event-driven pattern" the task wants.
      # When ANY file is created in the bucket under the "uploads/" prefix,
      # S3 automatically invokes this Lambda.
      # No polling, no cron jobs — it's instant and automatic.
      - s3:
          bucket: !Ref UploadBucket # Which S3 bucket to watch
          event: s3:ObjectCreated:* # Trigger on any file creation
          rules:
            - prefix: uploads/ # Only trigger for files in uploads/ folder
            - suffix: .csv # Only trigger for .csv files
          existing: true # Attach to an existing bucket (not create new)

# =============================================================================
# CUSTOM RESOURCES (CloudFormation)
# =============================================================================
# Serverless Framework uses AWS CloudFormation under the hood.
# The "resources" section lets you create any AWS resource that isn't
# covered by the built-in Serverless shortcuts.
# =============================================================================
resources:
  Resources:
    # -------------------------------------------------------------------------
    # S3 BUCKET: Where CSV files are uploaded
    # -------------------------------------------------------------------------
    UploadBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: clickpe-csv-uploads-${self:provider.stage}
        # ${self:provider.stage} appends the stage name (e.g., "dev")
        # so dev and prod don't share the same bucket.

        # CORS Configuration: Allows browsers to upload files directly to S3.
        # Without this, the browser would block the presigned URL upload.
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"] # Allow any headers
              AllowedMethods: [GET, PUT] # Allow GET (download) and PUT (upload)
              AllowedOrigins: ["*"] # Allow from any origin (restrict in prod)
              MaxAge: 3000 # Cache CORS preflight for 50 minutes

        # Automatically delete uploaded CSVs after 7 days to save storage costs.
        # We've already parsed them into Postgres, so we don't need the raw files.
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldUploads
              Status: Enabled
              ExpirationInDays: 7
              Prefix: uploads/

  # OUTPUT: After deployment, Serverless prints these values.
  # Useful for knowing your API URL and bucket name without digging through AWS Console.
  Outputs:
    UploadBucketName:
      Value: !Ref UploadBucket
      Description: Name of the S3 bucket for CSV uploads
    ApiEndpoint:
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
      Description: Base URL for the API Gateway
